
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GITHUB_APP_URL=https://github.com/settings/apps/devin-issue-resolver
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - DEVIN_API_KEY=${DEVIN_API_KEY}
      - DEVIN_ORG_ID=${DEVIN_ORG_ID}
      - SMEE_URL=${SMEE_URL}
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/devin_automation
      - GITHUB_APP_NAME=${GITHUB_APP_NAME}
      - FRONTEND_URL=${FRONTEND_URL}
      - API_URL=http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=devin_automation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  smee:
    image: node:18-alpine
    command: sh -c "npm install -g smee-client && smee --url ${SMEE_URL} --target http://backend:8000/webhooks/github --path /"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
